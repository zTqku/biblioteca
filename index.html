<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Biblioteca</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#e0306b"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Biblioteca">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#f5f3fb;--sf:#fff;--tx:#1d1840;--mu:#6b6690;--ac:#e0306b;--bd:#e2def2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16132e;--sf:#221e42;--tx:#f0edfb;--mu:#9d97c4;--ac:#ff6b98;--bd:#332e5c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16132e;--sf:#221e42;--tx:#f0edfb;--mu:#9d97c4;--ac:#ff6b98;--bd:#332e5c;color-scheme:dark}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.4 'Bricolage Grotesque',system-ui,sans-serif}
#app{max-width:720px;margin:0 auto;padding:18px 16px 130px}
h1{font-size:34px;font-weight:800;margin:6px 0 2px;letter-spacing:-.02em;line-height:1.1}
h2{margin:6px 0 0;font-size:24px;font-weight:800}
p{margin:2px 0}.mu,small{color:var(--mu)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:9px 14px;cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button.lk{border:0;background:none;padding:6px 8px;font-size:20px}
button.on{color:var(--ac)}.lk.on{animation:pop .35s}
.dg{color:#d6264f}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select,textarea{width:100%;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.row{display:flex;gap:8px;margin:12px 0;align-items:center;flex-wrap:wrap}
.row input[type=search]{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{position:relative;cursor:pointer}
.cov{aspect-ratio:1;border-radius:18px;overflow:hidden}
.cov img,.th img,.art img,.alc img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:grid;place-items:center;color:#fff;font-size:28px}
.card b{display:block;margin-top:8px}
.dots{position:absolute;top:6px;right:6px;padding:0 10px;font-size:20px;border-radius:99px;opacity:.92}
.ah{display:flex;gap:16px;align-items:flex-end;margin:10px 0}
.alc{width:118px;height:118px;border-radius:18px;overflow:hidden;flex:none}
.sr{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--bd);background:var(--bg)}
.sr.drag{position:relative;z-index:5;box-shadow:0 8px 22px rgba(0,0,0,.28);background:var(--sf)}
.h{touch-action:none;cursor:grab;padding:8px 6px;color:var(--mu);font-size:20px;user-select:none}
.th{width:46px;height:46px;border-radius:10px;overflow:hidden;flex:none;cursor:pointer}
.m{flex:1;min-width:0;cursor:pointer}
.m b,.m small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now b{color:var(--ac)}
#mini{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.mp{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:8px;box-shadow:0 8px 28px rgba(0,0,0,.22);cursor:pointer}
.mp .th{width:42px;height:42px}
svg{width:24px;height:24px;fill:currentColor;display:block}
.i2{display:none}.playing .i2{display:block}.playing .i1{display:none}
#full{position:fixed;inset:0;z-index:20;overflow:auto;background:var(--bg)}
#full:empty{display:none}
.fp{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 22px calc(22px + env(safe-area-inset-bottom,0px));text-align:center}
.art{width:min(76vw,330px);aspect-ratio:1;margin:16px auto;border-radius:26px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.playing .art{animation:br 2.6s ease-in-out infinite}
.eq{display:flex;gap:4px;height:22px;align-items:flex-end;justify-content:center;margin-bottom:8px}
.eq i{width:5px;height:4px;background:var(--ac);border-radius:3px}
.playing .eq i{animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}
@keyframes eq{50%{height:22px}}@keyframes br{50%{transform:scale(1.035)}}@keyframes pop{40%{transform:scale(1.5)}}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--ac)}
.tm{display:flex;justify-content:space-between;color:var(--mu);font-size:13px}
.ctl{display:flex;justify-content:space-between;align-items:center;margin:12px 0}
.big{width:64px;height:64px;border-radius:50%;padding:0;background:var(--ac);border-color:var(--ac);color:#fff;display:grid;place-items:center}
.big svg{width:30px;height:30px}
.ly{white-space:pre-wrap;font:inherit;text-align:left;background:var(--sf);border-radius:16px;padding:14px;max-height:220px;overflow:auto;margin:12px 0 0}
#ov{position:fixed;inset:0;z-index:30;pointer-events:none}
.bk{position:absolute;inset:0;background:rgba(10,8,30,.55);display:flex;align-items:flex-end;pointer-events:auto}
.sh{width:100%;max-width:520px;margin:0 auto;background:var(--sf);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;max-height:88vh;overflow:auto}
.sh button{text-align:left}.sh label{font-size:13px;color:var(--mu)}
#ts{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:40;display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div id="app"></div><div id="mini"></div><div id="full"></div><div id="ov"></div><div id="ts"></div>
<audio id="au"></audio>
<input type="file" id="fi" accept="audio/*" multiple hidden>
<script>
const $=s=>document.querySelector(s),au=$('#au');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let songs=[],albums=[],db=null,view='lib',q='',sort='date',queue=[],qi=-1,shuffle=false,fullOpen=false,pend=null;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const fmt=t=>isFinite(t)?Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0'):'0:00';
const PP='<svg class="i1" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg class="i2" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
const PV='<svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg>',NX='<svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>';
function toast(t){const e=$('#ts');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2400)}
const st=(n,m)=>db?db.transaction(n,m).objectStore(n):null;
function put(n,o){try{const r=st(n,'readwrite')?.put(o);if(r)r.onerror=()=>toast('No se pudo guardar. Revisa el espacio del teléfono.')}catch(e){toast('No se pudo guardar')}}
function del(n,id){try{st(n,'readwrite')?.delete(id)}catch(e){}}
function load(){return new Promise(res=>{try{const r=indexedDB.open('bib-musica',1);r.onupgradeneeded=()=>{r.result.createObjectStore('songs',{keyPath:'id'});r.result.createObjectStore('albums',{keyPath:'id'})};r.onsuccess=()=>{db=r.result;let n=0;const d=()=>{if(++n==2)res()};st('songs','readonly').getAll().onsuccess=e=>{songs=e.target.result;d()};st('albums','readonly').getAll().onsuccess=e=>{albums=e.target.result;d()}};r.onerror=()=>res()}catch(e){res()}})}
const sSong=id=>songs.find(s=>s.id==id),alb=id=>albums.find(a=>a.id==id);
const cv=(o,ch='♪')=>o.cover?`<img src="${o.cover}" alt="">`:`<div class="ph" style="background:linear-gradient(135deg,hsl(${hue(o.id)} 60% 52%),hsl(${(hue(o.id)+50)%360} 60% 38%))">${ch}</div>`;
const raw=v=>v=='all'?[...songs]:v=='fav'?songs.filter(s=>s.fav):(alb(v)?.order||[]).map(sSong).filter(Boolean);
function list(v){let l=raw(v);if(q){const k=q.toLowerCase();l=l.filter(s=>(s.title+' '+s.artist).toLowerCase().includes(k))}
const c={title:(x,y)=>x.title.localeCompare(y.title),artist:(x,y)=>x.artist.localeCompare(y.artist),date:(x,y)=>y.date-x.date}[sort];
if(c)l.sort(c);return l}
const curList=()=>list(view=='lib'?'all':view);
function img(f,max=480){return new Promise(res=>{const r=new FileReader();r.onload=()=>{if(f.type=='image/gif'&&f.size<3e6)return res(r.result);const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};i.onerror=()=>res(null);i.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(f)})}
function go(id){view=id;q='';sort=alb(id)?'manual':'date';render();scrollTo(0,0)}
function render(){const v=view,a=alb(v);if(v!='lib'&&v!='all'&&v!='fav'&&!a){view='lib';return render()}
const n=v=='lib'?`${songs.length} canciones · ${albums.length} álbumes`:`${raw(v).length} canciones`;
let h=v!='lib'?`<button class="lk" onclick="go('lib')">← Biblioteca</button>`:'';
if(a)h+=`<div class="ah"><div class="alc">${cv(a)}</div><div><h1>${esc(a.name)}</h1><p class="mu">${esc(a.desc)}</p><p class="mu">${n}</p></div></div>`;
else h+=`<h1>${v=='lib'?'Biblioteca':v=='all'?'Todas las canciones':'Favoritos'}</h1><p class="mu">${n}</p>`;
h+='<div class="row">';
if(v!='lib')h+=`<button class="pri" onclick="playAll(0)">Reproducir</button><button onclick="playAll(1)">Aleatorio</button>`;else h+=`<button onclick="albumForm()">+ Álbum</button>`;
h+=`<button class="${v=='lib'?'pri':''}" onclick="$('#fi').click()">+ Canciones</button>`;
if(a)h+=`<button onclick="albumForm('${a.id}')">Editar</button>`;
h+=`</div><div class="row"><input id="q" type="search" placeholder="Buscar canciones" value="${esc(q)}" oninput="q=this.value;res()">`;
if(v!='lib'){const o=[['manual','Orden propio'],['title','Título'],['artist','Artista'],['date','Fecha']].filter(x=>a||x[0]!='manual');h+=`<select id="so" style="width:auto" onchange="sort=this.value;res()">${o.map(x=>`<option value="${x[0]}" ${sort==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select>`}
h+=`</div><div id="res"></div><p class="mu" style="text-align:center;margin-top:28px">«Todo se guarda localmente en tu teléfono.»</p>`;
$('#app').innerHTML=h;res()}
function res(){const v=view;let h='';
if(v=='lib'&&!q){const cs=[{id:'fav',name:'Favoritos',ch:'♥'},{id:'all',name:'Todas las canciones',ch:'♪'},...[...albums].sort((x,y)=>(y.pinned|0)-(x.pinned|0)||x.date-y.date)];
h='<div class="grid">'+cs.map(o=>{const n=o.ch?raw(o.id).length:o.order.length;return `<div class="card" onclick="go('${o.id}')"><div class="cov">${cv(o,o.ch)}</div><b>${esc(o.name)}</b><small>${n} canciones${o.pinned?' · Fijado':''}</small>${o.ch?'':`<button class="dots" onclick="event.stopPropagation();albMenu('${o.id}')">⋮</button>`}</div>`}).join('')+'</div>';
if(!songs.length)h+='<p class="mu" style="margin-top:20px">Aún no hay música. Toca «+ Canciones» y elige audios de tu teléfono.</p>'}
else{const l=curList();const man=!!alb(v)&&sort=='manual'&&!q;const now=queue[qi];
if(!l.length)h=`<p class="mu" style="margin-top:16px">${q?'Sin resultados.':alb(v)?'Este álbum está vacío. Agrega canciones con «+ Canciones» o desde el menú ⋮ de una canción.':v=='fav'?'Toca ♡ en una canción para verla aquí.':'Aún no hay música. Toca «+ Canciones».'}</p>`;
else h=l.map(s=>`<div class="sr ${s.id==now?'now':''}" data-sid="${s.id}">${man?'<span class="h">≡</span>':''}<div class="th" onclick="play('${s.id}')">${cv(s)}</div><div class="m" onclick="play('${s.id}')"><b>${esc(s.title)}</b><small>${esc(s.artist)}</small></div><button class="lk ${s.fav?'on':''}" onclick="fav('${s.id}')">${s.fav?'♥':'♡'}</button><button class="lk" onclick="songMenu('${s.id}')">⋮</button></div>`).join('')}
$('#res').innerHTML=h}
$('#fi').onchange=e=>{const a=alb(view);let i=0;for(const f of e.target.files){const nm=f.name.replace(/\.[^.]+$/,''),m=nm.split(' - ');const s={id:uid(),title:(m.length>1?m.slice(1).join(' - '):nm).trim(),artist:m.length>1?m[0].trim():'Artista desconocido',date:Date.now()+i++,blob:f,fav:view=='fav',lyrics:'',cover:''};songs.push(s);put('songs',s);if(a)a.order.push(s.id)}if(a)put('albums',a);e.target.value='';render();if(i)toast(i+' canciones guardadas')};
function fav(id){const s=sSong(id);s.fav=!s.fav;put('songs',s);render();pl()}
/* Reproductor */
const curS=()=>sSong(queue[qi]);
function load_(i){const s=sSong(queue[i]);if(!s||!s.blob)return;qi=i;if(au.dataset.u)URL.revokeObjectURL(au.dataset.u);au.dataset.u=au.src=URL.createObjectURL(s.blob);au.play().catch(()=>{});pl()}
function play(id){queue=curList().map(s=>s.id);load_(queue.indexOf(id))}
function playAll(sh){queue=curList().map(s=>s.id);if(!queue.length)return;shuffle=!!sh;load_(sh?Math.floor(Math.random()*queue.length):0)}
function next(){const n=queue.length;if(!n)return;let i=(qi+1)%n;if(shuffle&&n>1)do{i=Math.floor(Math.random()*n)}while(i==qi);load_(i)}
function prev(){if(au.currentTime>3)au.currentTime=0;else if(queue.length)load_((qi-1+queue.length)%queue.length)}
const tg=()=>au.paused?au.play():au.pause();
const shuf=()=>{shuffle=!shuffle;full()};
function pl(){const s=curS(),m=$('#mini');if($('#res'))res();
if(!s){m.innerHTML='';full();return}
m.innerHTML=`<div class="mp" onclick="fullOpen=true;full()"><div class="th">${cv(s)}</div><div class="m"><b>${esc(s.title)}</b><small>${esc(s.artist)}</small></div><button class="lk ${s.fav?'on':''}" onclick="event.stopPropagation();fav('${s.id}')">${s.fav?'♥':'♡'}</button><button class="lk" onclick="event.stopPropagation();tg()">${PP}</button></div>`;full()}
function full(){const s=curS(),f=$('#full');if(!fullOpen||!s){f.innerHTML='';return}
f.innerHTML=`<div class="fp"><button class="lk" onclick="fullOpen=false;full()">⌄ Cerrar</button><div class="art">${cv(s)}</div><div class="eq"><i></i><i></i><i></i><i></i></div><h2>${esc(s.title)}</h2><p class="mu">${esc(s.artist)}</p><div class="row" style="justify-content:center"><button class="lk ${s.fav?'on':''}" onclick="fav('${s.id}')">${s.fav?'♥ Me gusta':'♡ Me gusta'}</button><button onclick="addTo('${s.id}')">+ Álbum</button></div><input type="range" id="sk" min="0" step="0.1" value="0" oninput="au.currentTime=this.value"><div class="tm"><span id="t1">0:00</span><span id="t2">0:00</span></div><div class="ctl"><button class="${shuffle?'pri':''}" onclick="shuf()">Aleatorio</button><button class="lk" onclick="prev()">${PV}</button><button class="big" onclick="tg()">${PP}</button><button class="lk" onclick="next()">${NX}</button><span style="width:90px"></span></div>${s.lyrics?`<pre class="ly">${esc(s.lyrics)}</pre>`:''}</div>`;upd()}
function upd(){const k=$('#sk');if(!k)return;k.max=au.duration||0;k.value=au.currentTime;$('#t1').textContent=fmt(au.currentTime);$('#t2').textContent=fmt(au.duration)}
au.ontimeupdate=au.onloadedmetadata=upd;au.onended=next;
au.onplay=au.onpause=()=>document.body.classList.toggle('playing',!au.paused);
/* Menús */
const cl=()=>$('#ov').innerHTML='';
function sheet(h){$('#ov').innerHTML=`<div class="bk" onclick="cl()"><div class="sh" onclick="event.stopPropagation()">${h}</div></div>`}
function ask(t,fn){pend=fn;sheet(`<b>${t}</b><button class="dg" onclick="cl();pend()">Eliminar</button><button onclick="cl()">Cancelar</button>`)}
function songMenu(id){const s=sSong(id),a=alb(view);sheet(`<b>${esc(s.title)}</b><button onclick="addTo('${id}')">Agregar a álbum</button><button onclick="editSong('${id}')">Editar nombre, letra y portada</button>${a&&a.order.includes(id)?`<button onclick="cl();a_rm('${id}')">Quitar de este álbum</button>`:''}<button class="dg" onclick="ask('¿Eliminar de la biblioteca?',()=>delSong('${id}'))">Eliminar canción</button>`)}
function a_rm(id){const a=alb(view);a.order=a.order.filter(x=>x!=id);put('albums',a);render()}
function delSong(id){songs=songs.filter(s=>s.id!=id);albums.forEach(a=>{if(a.order.includes(id)){a.order=a.order.filter(x=>x!=id);put('albums',a)}});del('songs',id);const c=queue[qi];queue=queue.filter(x=>x!=id);if(c==id){au.pause();au.removeAttribute('src');qi=-1}else qi=queue.indexOf(c);render();pl()}
function addTo(id){sheet(`<b>Agregar a álbum</b>${albums.map(a=>`<button onclick="tgAl('${a.id}','${id}')">${a.order.includes(id)?'✓ ':''}${esc(a.name)}</button>`).join('')}<button class="pri" onclick="albumForm('','${id}')">+ Nuevo álbum</button><button onclick="cl()">Listo</button>`)}
function tgAl(aid,id){const a=alb(aid),i=a.order.indexOf(id);i<0?a.order.push(id):a.order.splice(i,1);put('albums',a);render();addTo(id)}
function editSong(id){const s=sSong(id);sheet(`<b>Editar canción</b><label>Título<input id="e1" value="${esc(s.title)}"></label><label>Artista<input id="e2" value="${esc(s.artist)}"></label><label>Letra<textarea id="e3" rows="5">${esc(s.lyrics)}</textarea></label><label>Portada<input type="file" id="e4" accept="image/*"></label><button class="pri" onclick="saveSong('${id}')">Guardar cambios</button>`)}
async function saveSong(id){const s=sSong(id),f=$('#e4').files[0],c=f?await img(f):null;s.title=$('#e1').value.trim()||s.title;s.artist=$('#e2').value.trim()||s.artist;s.lyrics=$('#e3').value;if(c)s.cover=c;put('songs',s);cl();render();pl()}
function albMenu(id){const a=alb(id);sheet(`<b>${esc(a.name)}</b><button onclick="a_pin('${id}')">${a.pinned?'Desfijar':'Fijar arriba'}</button><button onclick="albumForm('${id}')">Editar</button><button class="dg" onclick="ask('¿Eliminar el álbum? Las canciones se conservan.',()=>a_del('${id}'))">Eliminar álbum</button>`)}
function a_pin(id){const a=alb(id);a.pinned=!a.pinned;put('albums',a);cl();render()}
function a_del(id){albums=albums.filter(a=>a.id!=id);del('albums',id);if(view==id)view='lib';render()}
function albumForm(id,sid){const a=alb(id)||{name:'',desc:''};sheet(`<b>${id?'Editar álbum':'Nuevo álbum'}</b><label>Nombre<input id="e1" value="${esc(a.name)}"></label><label>Descripción<input id="e2" value="${esc(a.desc)}"></label><label>Portada (imagen o GIF)<input type="file" id="e3" accept="image/*"></label><button class="pri" onclick="saveAlb('${id||''}','${sid||''}')">Guardar</button>`)}
async function saveAlb(id,sid){const nm=$('#e1').value.trim();if(!nm)return toast('Ponle un nombre al álbum');const f=$('#e3').files[0],c=f?await img(f):null;let a=alb(id);if(!a){a={id:uid(),pinned:false,date:Date.now(),order:sid?[sid]:[],cover:''};albums.push(a)}a.name=nm;a.desc=$('#e2').value.trim();if(c)a.cover=c;put('albums',a);cl();render()}
/* Reordenar arrastrando */
let dg=null,y0=0;
document.addEventListener('pointerdown',e=>{const h=e.target.closest('.h');if(!h)return;dg=h.closest('[data-sid]');y0=e.clientY;dg.classList.add('drag');h.setPointerCapture(e.pointerId)});
document.addEventListener('pointermove',e=>{if(dg)dg.style.transform=`translateY(${e.clientY-y0}px)`});
document.addEventListener('pointerup',e=>{if(!dg)return;const rows=[...document.querySelectorAll('#res [data-sid]')].filter(r=>r!==dg),i=rows.filter(r=>{const b=r.getBoundingClientRect();return b.top+b.height/2<e.clientY}).length,ids=rows.map(r=>r.dataset.sid);ids.splice(i,0,dg.dataset.sid);const a=alb(view);dg=null;if(a){a.order=ids;put('albums',a)}res()});
load().then(render);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
try{navigator.storage?.persist?.()}catch(e){}
</script></body></html>
